name: Deploy Debatefrog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-debatefrog-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: websites-prod-496602
      GCP_REGION: us-central1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/794701187875/locations/global/workloadIdentityPools/github-actions/providers/polyvise-main
          service_account: github-actions-deployer@websites-prod-496602.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Deploy Debatefrog to Cloud Run
        env:
          POLYVISE_REPOSITORY: firestore
          POLYVISE_ENABLE_MOCK_LLM: "false"
          POLYVISE_EVIDENCE_PROVIDER: tavily
          IMAGE: us-central1-docker.pkg.dev/websites-prod-496602/polyvise/debatefrog-web:${{ github.sha }}
        run: |
          docker build \
            --build-arg APP_WORKSPACE=@polyvise/debatefrog-web \
            --build-arg APP_DIR=apps/debatefrog-web \
            -t "$IMAGE" \
            .
          docker push "$IMAGE"
          gcloud run deploy debatefrog-web \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --memory "${GCP_CLOUD_RUN_MEMORY:-1Gi}" \
            --cpu "${GCP_CLOUD_RUN_CPU:-1}" \
            --concurrency 20 \
            --min-instances 0 \
            --max-instances "${GCP_CLOUD_RUN_MAX_INSTANCES:-3}" \
            --timeout 300 \
            --set-env-vars "NEXT_PUBLIC_SITE_URL=https://debatefrog.com,POLYVISE_REPOSITORY=$POLYVISE_REPOSITORY,FIRESTORE_PROJECT_ID=$GCP_PROJECT_ID,POLYVISE_ENABLE_MOCK_LLM=$POLYVISE_ENABLE_MOCK_LLM,POLYVISE_EVIDENCE_PROVIDER=$POLYVISE_EVIDENCE_PROVIDER,POLYVISE_QUICK_MODEL=openai/gpt-4o-mini,POLYVISE_DEEP_MODEL=openai/gpt-4o-mini,POLYVISE_JUDGE_MODEL=openai/gpt-4o-mini,POLYVISE_LLM_TIMEOUT_MS=45000,POLYVISE_LLM_MAX_TOKENS=1000" \
            --update-secrets "OPENROUTER_API_KEY=debatefrog-openrouter-api-key:latest,TAVILY_API_KEY=debatefrog-tavily-api-key:latest"
