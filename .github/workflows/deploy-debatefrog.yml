name: Deploy Debatefrog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-debatefrog-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: websites-prod-496602
      GCP_REGION: us-central1
      POLYVISE_REPOSITORY: firestore
      POLYVISE_ENABLE_MOCK_LLM: "false"
      POLYVISE_EVIDENCE_PROVIDER: tavily

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/794701187875/locations/global/workloadIdentityPools/github-actions/providers/polyvise-main
          service_account: github-actions-deployer@websites-prod-496602.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Debatefrog to Cloud Run
        run: ./scripts/gcp-deploy.sh debatefrog
