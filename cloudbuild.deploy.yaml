steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - APP_WORKSPACE=${_APP_WORKSPACE}
      - --build-arg
      - APP_DIR=${_APP_DIR}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_DEPLOY_CHANNEL=${_NEXT_PUBLIC_DEPLOY_CHANNEL}
      - --tag
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}
